[project]
name = "engine-rag"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-adapter",
    "engine-array",
    "engine-database",
    "engine-error",
    "engine-fs",
    "engine-json",
    "engine-llm",
    "engine-number",
    "engine-string",
    "engine-thread",
    "sqlalchemy[asyncio]==2.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
