[project]
name = "engine-fs"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-adapter",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-thread",
    "anyio==4.15.1",
    "av==19.0.1",
    "charset-normalizer==3.5.2",
    "kreuzberg==4.10.4",
    "obstore==0.12.0",
    "pillow==13.0.0",
    "pypdf==6.21.1",
    "pypdfium2==5.14.0",
    "python-calamine==0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
