[project]
name = "engine-cache"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-error",
    "engine-fast",
    "engine-json",
    "engine-log",
    "engine-rand",
    "engine-thread",
    "redis==8.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
