[project]
name = "engine-http"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-array",
    "engine-cache",
    "engine-context",
    "engine-date",
    "engine-error",
    "engine-exception",
    "engine-json",
    "engine-log",
    "engine-net",
    "engine-parse",
    "engine-validate",
    "fastapi==0.146.0",
    "granian==2.8.4",
    "python-multipart==0.0.32",
    "scalar-fastapi==1.9.1",
    "starlette==1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
