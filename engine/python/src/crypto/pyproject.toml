[project]
name = "engine-crypto"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-error",
    "engine-fs",
    "engine-json",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
