[project]
name = "engine-config"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-error",
    "engine-log",
    "engine-parse",
    "engine-validate",
    "pydantic-settings==2.16.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
