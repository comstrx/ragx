[project]
name = "engine-llm"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-adapter",
    "engine-date",
    "engine-error",
    "engine-fast",
    "engine-fs",
    "engine-json",
    "engine-log",
    "engine-net",
    "engine-number",
    "engine-rand",
    "engine-string",
    "engine-thread",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
