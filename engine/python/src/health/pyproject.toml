[project]
name = "engine-health"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-cache",
    "engine-database",
    "engine-date",
    "engine-error",
    "engine-event",
    "engine-http",
    "engine-llm",
    "engine-log",
    "engine-queue",
    "engine-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
