[project]
name = "engine-token"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = ["engine-crypto", "engine-date", "engine-error", "engine-rand", "pyjwt==2.15.1"]

[build-system]
