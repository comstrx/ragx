[project]
name = "engine-database"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-array",
    "engine-context",
    "engine-date",
    "engine-error",
    "engine-json",
    "engine-log",
    "engine-rand",
    "asyncpg==0.32.0",
    "sqlalchemy[asyncio]==2.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
