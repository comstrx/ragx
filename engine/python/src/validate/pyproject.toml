[project]
name = "engine-validate"
version = "0.1.0"
requires-python = ">=3.15"
license = "Apache-2.0"
dependencies = [
    "engine-date",
    "engine-error",
    "engine-net",
    "engine-parse",
    "engine-string",
    "pydantic-core==2.50.1",
    "pydantic==2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
