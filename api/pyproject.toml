[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aio-pika==10.1.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "fastapi==0.146.0",
    "granian==2.8.4",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "obstore==0.12.0",
    "orjson==3.13.0",
    "phonenumbers==9.0.41",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyjwt==2.15.1",
    "pypdf==6.21.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "scalar-fastapi==1.9.1",
    "sqlalchemy[asyncio]==2.1.5",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs==0.32.0",
    "httpx2==2.14.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
    "watchfiles==1.3.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/app", "src/config", "src/routes", "src/bootstrap", "src/database"]

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src", "tests", "benches"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM", "CPY", "D", "FBT001", "FBT002", "I", "TC", "ANN401", "E401", "E701", "N818"]

[tool.ruff.lint.per-file-ignores]
"src/core/error/fault.py" = ["C901", "PLR0911", "PLR0912"]
"src/core/parse/probe.py" = ["C901", "PLR0911", "PLR0912"]
"src/core/parse/parse.py" = ["PLR0911"]
"src/core/rand/pick.py" = ["S311"]
"src/core/string/script.py" = ["RUF001"]
"src/core/gateway/gateway.py" = ["ARG002"]
"src/core/domain/contract.py" = ["ARG002"]
"src/core/fs/driver.py" = ["ARG002"]
"src/core/llm/provider.py" = ["ARG002"]
"src/core/rand/fake.py" = ["S311"]
"src/core/exception/exceptions.py" = ["BLE001"]
"src/core/thread/tasks.py" = ["BLE001"]
"src/core/context/context.py" = ["BLE001"]
"src/core/broker/broker.py" = ["BLE001"]
"src/core/thread/thread.py" = ["BLE001"]
"src/core/fs/watch.py" = ["BLE001"]
"src/core/fs/archive.py" = ["S202"]
"src/core/fs/scan.py" = ["PLR0911"]
"src/core/date/parser.py" = ["DTZ007"]
"src/core/date/format.py" = ["C901", "PLR0911", "PLR0912", "DTZ007"]
"src/core/health/health.py" = ["BLE001"]
"src/core/database/session.py" = ["PLR0911"]
"src/core/queue/queue.py" = ["BLE001"]
"src/core/database/outbox.py" = ["BLE001"]
"src/core/schedule/task.py" = ["BLE001"]
"src/database/seeders/**" = ["S608"]
"src/app/enums/**" = ["C901", "PLR0911", "PLR0912"]
"tests/**" = [
    "INP001", "S105", "S106", "S301", "PLR0915", "PLR2004", "FBT003", "ARG001", "ARG002", "ARG005", "EM101", "TRY003",
]
"src/tests/**" = ["S105", "S106", "PLR0915", "PLR2004", "FBT003", "ARG001", "ARG002"]
"conftest.py" = ["ARG001"]
"benches/**" = ["T201", "PLR2004", "S311"]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8

[tool.mypy]
python_version = "3.15"
strict = true
strict_bytes = true
local_partial_types = true
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "benches", "conftest.py"]

[tool.pytest]
testpaths = ["tests", "src/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
strict = true
filterwarnings = ["error"]
