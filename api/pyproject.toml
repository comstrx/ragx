[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.143.3",
    "granian==2.8.4",
    "orjson==3.13.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "scalar-fastapi==1.9.1",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs==0.32.0",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "watchfiles==1.3.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM", "CPY", "D", "FBT001", "FBT002", "I", "TC", "ANN401", "E401", "E701", "N818"]

[tool.ruff.lint.per-file-ignores]
"core/error/code.py" = ["C901", "PLR0911", "PLR0912"]
"core/database/query.py" = ["S608"]
"core/database/migrate.py" = ["S608"]
"core/database/errors.py" = ["PLR0911"]
"database/seeders/**" = ["S608"]
"app/enums/**" = ["C901", "PLR0911", "PLR0912"]
"tests/**" = ["S101", "PLR2004", "ARG002", "EM101", "TRY003"]
"benches/**" = ["T201", "PLR2004"]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["core", "app", "config", "routes", "bootstrap", "tests", "benches"]

[tool.pytest.ini_options]
testpaths = ["tests"]
