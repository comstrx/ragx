[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aiosmtplib==5.1.3",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "fastapi==0.143.3",
    "granian==2.8.4",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "obstore==0.12.0",
    "orjson==3.13.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "scalar-fastapi==1.9.1",
    "sqlalchemy[asyncio]==2.1.5",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs==0.32.0",
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "watchfiles==1.3.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/app", "src/config", "src/routes", "src/bootstrap", "src/database"]

[tool.ruff]
target-version = "py315"
line-length = 120
src = ["src", "tests", "benches"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM", "CPY", "D", "FBT001", "FBT002", "I", "TC", "ANN401", "E401", "E701", "N818"]

[tool.ruff.lint.per-file-ignores]
"src/core/exceptions/code.py" = ["C901", "PLR0911", "PLR0912"]
"src/core/database/query.py" = ["S608"]
"src/core/database/migrate.py" = ["S608"]
"src/core/database/errors.py" = ["PLR0911"]
"src/core/queue/queue.py" = ["BLE001"]
"src/core/schedule/schedule.py" = ["BLE001"]
"src/bootstrap/commands.py" = ["T201"]
"src/database/seeders/**" = ["S608"]
"src/app/enums/**" = ["C901", "PLR0911", "PLR0912"]
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "PLR0915",
    "PLR2004",
    "PT011",
    "PT012",
    "PT018",
    "FBT003",
    "ARG001",
    "ARG002",
    "EM101",
    "TRY003",
]
"benches/**" = ["T201", "PLR2004"]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "benches"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
