global
    log stdout format raw local0
    maxconn {{EDGE_MAXCONN}}
    tune.stick-counters 4
    hard-stop-after 1h
    stats socket /run/haproxy/admin.sock mode 600 level admin expose-fd listeners
    stats socket ipv4@127.0.0.1:9999 level admin
    stats timeout 10s
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-curves X25519MLKEM768:X25519:P-256:P-384

defaults
    mode http
    log global
    option dontlognull
    option http-keep-alive
    option http-buffer-request
    option redispatch 1
    retries 2
    retry-on conn-failure empty-response
    timeout connect 1s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout queue 5s
    timeout check 2s
    timeout tunnel 1h
    timeout client-fin 30s
    timeout server-fin 30s
    unique-id-format %[uuid(7)]
    log-format '{"time":"%tr","id":"%ID","client":"%ci","frontend":"%ft","backend":"%b","server":"%s","method":"%HM","path":"%HP","version":"%HV","status":%ST,"bytes":%B,"queue_ms":%Tw,"connect_ms":%Tc,"response_ms":%Tr,"total_ms":%Ta,"retries":%rc,"termination":"%tsc"}'

resolvers docker
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s
    hold nx 2s
    hold timeout 2s
    hold refused 2s

frontend status
    bind :9090
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 200 content-type text/plain string alive if { path /live }
    http-request deny deny_status 404

frontend public
{{HAPROXY_BINDS}}
{{HAPROXY_CLIENT}}
    http-request deny deny_status 404 unless { req.hdr(host),lower,field(1,:) -m str {{HAPROXY_HOSTS}} }
{{HAPROXY_LIMITS}}
{{HAPROXY_REDIRECT}}
    http-request set-var(txn.selection) str(active),map(/etc/haproxy/active.map,unavailable:none)
    http-request set-var(txn.slot) var(txn.selection),field(1,:)
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Request-ID %[unique-id]
    http-response del-header Server
    http-response del-header X-Powered-By
    http-after-response set-header X-Request-ID %[unique-id]
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header X-Release %[var(txn.selection),field(2,:)]
{{HAPROXY_SECURITY}}
    use_backend acme if { path_beg /.well-known/acme-challenge/ }
{{HAPROXY_ROUTES}}

frontend candidate
{{HAPROXY_CANDIDATE}}
    http-request deny deny_status 403 unless { req.hdr(X-Slot) -m str blue green }
    http-request set-var(txn.slot) req.hdr(X-Slot)
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Request-ID %[unique-id]
{{HAPROXY_ROUTES}}

{{HAPROXY_BACKENDS}}
backend acme
    server certificate acme:8080 resolvers docker init-addr none

backend unavailable
    http-request return status 503 content-type text/plain string unavailable
