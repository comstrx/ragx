server {
    listen 8080 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        ${HTTP_FALLBACK}
    }
}
