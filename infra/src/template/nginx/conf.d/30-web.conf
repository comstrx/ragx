server {
    listen ${SITE_LISTEN};
    ${SITE_QUIC}
    server_name ${SUPER_HOST};
    ${SITE_TLS}
    include /etc/nginx/platform/site.inc;

    location / {
        limit_req zone=web burst=${WEB_BURST} nodelay;
        include /etc/nginx/platform/proxy.inc;
        proxy_pass http://web_super;
    }
}

server {
    listen ${SITE_LISTEN};
    ${SITE_QUIC}
    server_name ${ADMIN_HOST};
    ${SITE_TLS}
    include /etc/nginx/platform/site.inc;

    location / {
        limit_req zone=web burst=${WEB_BURST} nodelay;
        include /etc/nginx/platform/proxy.inc;
        proxy_pass http://web_admin;
    }
}

server {
    listen ${SITE_LISTEN};
    ${SITE_QUIC}
    server_name ${CLIENT_HOSTS};
    ${SITE_TLS}
    include /etc/nginx/platform/site.inc;

    location / {
        limit_req zone=web burst=${WEB_BURST} nodelay;
        include /etc/nginx/platform/proxy.inc;
        proxy_pass http://web_client;
    }
}
