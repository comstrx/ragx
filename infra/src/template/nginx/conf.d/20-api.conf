server {
    listen ${SITE_LISTEN};
    ${SITE_QUIC}
    server_name ${API_HOST};
    ${SITE_TLS}
    include /etc/nginx/platform/site.inc;

    location ~ /\. {
        deny all;
    }

    location ${API_PREFIX}/auth/ {
        limit_req zone=auth burst=${AUTH_BURST} nodelay;
        include /etc/nginx/platform/proxy.inc;
        proxy_pass http://api;
    }

    location = /ws {
        include /etc/nginx/platform/proxy.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout ${SOCKET_TIMEOUT};
        proxy_send_timeout ${SOCKET_TIMEOUT};
        proxy_buffering off;
        proxy_pass http://api;
    }

    location ~ ^/(assets|storage)/ {
        limit_req zone=web burst=${WEB_BURST} nodelay;
        include /etc/nginx/platform/proxy.inc;
        proxy_cache assets;
        proxy_cache_valid 200 ${STATIC_CACHE};
        proxy_cache_use_stale error timeout updating http_502 http_503;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        proxy_pass http://api;
    }

    location / {
        limit_req zone=api burst=${API_BURST} nodelay;
        include /etc/nginx/platform/proxy.inc;
        proxy_pass http://api;
    }
}
