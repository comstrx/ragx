worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    proxy_cache_path /tmp/cache levels=1:2 keys_zone=assets:16m max_size=${EDGE_CACHE_SIZE} inactive=7d use_temp_path=off;

    log_format platform escape=json '{"time":"$time_iso8601","host":"$host","client":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"took":$request_time,"upstream":"$upstream_addr","upstream_took":"$upstream_response_time","referer":"$http_referer","agent":"$http_user_agent","request_id":"$request_id"}';
    access_log /dev/stdout platform;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size ${UPLOAD_MAX_MB}m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;
    http2_max_concurrent_streams 128;
    merge_slashes on;
    absolute_redirect off;
    quic_retry on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/manifest+json application/ld+json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    limit_req_zone $binary_remote_addr zone=api:16m rate=${API_PER_MINUTE}r/m;
    limit_req_zone $binary_remote_addr zone=auth:8m rate=${AUTH_PER_MINUTE}r/m;
    limit_req_zone $binary_remote_addr zone=web:16m rate=${WEB_PER_MINUTE}r/m;
    limit_conn_zone $binary_remote_addr zone=perip:16m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    resolver 127.0.0.11 ipv6=off valid=${RESOLVER_VALID};
    resolver_timeout 3s;

    upstream api {
        zone up_api 64k;
        server api:8000 resolve;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream web_super {
        zone up_web_super 64k;
        server web-super:3000 resolve;
        keepalive 16;
    }

    upstream web_admin {
        zone up_web_admin 64k;
        server web-admin:3000 resolve;
        keepalive 16;
    }

    upstream web_client {
        zone up_web_client 64k;
        server web-client:3000 resolve;
        keepalive 32;
    }

    include /etc/nginx/platform/conf.d/*.conf;
}
