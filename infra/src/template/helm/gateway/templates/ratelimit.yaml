apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
  rateLimit:
    type: Local
    local:
      rules:
        {{- range $family := list "0.0.0.0/0" "::/0" }}
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: {{ $family | quote }}
          limit:
            requests: {{ $.Values.rateLimitPerMinute }}
            unit: Minute
        {{- end }}
