{{- if .Values.trustedCidrs }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: client
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        {{- range .Values.trustedCidrs }}
        - {{ . | quote }}
        {{- end }}
{{- end }}
