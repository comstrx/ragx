secretRef: platform-secrets

storageClass: local-path
priorityClass: platform-data

redis:
  enabled: true
  image: redis:7-alpine
  size: 5Gi
  maxmemory: 768mb
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

postgresql:
  enabled: false
  image: postgres:18
  size: 20Gi
  database: backend
  username: app
  initdbArgs: --locale-provider=icu --icu-locale=und --encoding=UTF8
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
