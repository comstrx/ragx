{{- if .Values.backup.enabled }}
{{- $name := include "service.name" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "service.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "service.selector" (merge (dict "component" "backup") .) | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $name }}-backup
          automountServiceAccountToken: false
          {{- include "service.pullSecrets" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          containers:
            - name: backup
              image: {{ include "service.backupImage" . }}
              envFrom:
                - configMapRef:
                    name: {{ $name }}-config
                - secretRef:
                    name: {{ $name }}-backup-secrets
              env:
                - name: BACKUP_TARGET
                  value: {{ .Values.backup.target | quote }}
                - name: BACKUP_PATH
                  value: {{ .Values.backup.mount | quote }}
                - name: BACKUP_KEEP_DAYS
                  value: {{ .Values.backup.keepDays | quote }}
                - name: S3_BACKUP_BUCKET
                  value: {{ .Values.backup.bucket | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.backup.endpoint | quote }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.backup.region | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $name }}-backup-secrets
                      key: DB_PASSWORD
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $name }}-backup-secrets
                      key: BACKUP_AWS_ACCESS_KEY_ID
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $name }}-backup-secrets
                      key: BACKUP_AWS_SECRET_ACCESS_KEY
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 1Gi }
              {{- if .Values.backup.storage.enabled }}
              volumeMounts:
                - name: backups
                  mountPath: {{ .Values.backup.mount }}
              {{- end }}
          {{- if .Values.backup.storage.enabled }}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ $name }}-backups
          {{- end }}
{{- end }}
