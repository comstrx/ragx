{{- $web := .Values.processes.web }}
{{- if and $web.enabled (gt (int ($web.replicas | default 1)) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "service.name" . }}-web
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "service.selector" (merge (dict "component" "web") .) | nindent 6 }}
{{- end }}
