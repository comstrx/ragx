{{- if .Values.route.enabled }}
{{- $name := include "service.name" . }}
{{- $headers := .Values.route.responseHeaders }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
      namespace: {{ .Values.route.gatewayNamespace }}
      {{- with .Values.route.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- include "service.responseHeaders" $headers | nindent 6 }}
      backendRefs:
        - name: {{ $name }}
          port: {{ .Values.processes.web.port }}
{{- end }}
