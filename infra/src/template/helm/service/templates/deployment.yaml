{{- $root := . }}
{{- $name := include "service.name" . }}
{{- range $process, $spec := .Values.processes }}
{{- if $spec.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $process }}
  labels:
    {{- include "service.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $process }}
spec:
  {{- if not (and $root.Values.autoscaling.enabled (eq $process "web")) }}
  replicas: {{ $spec.replicas | default 1 }}
  {{- end }}
  {{- if $spec.port }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ $root.Values.rollout.unavailable }}
      maxSurge: {{ $root.Values.rollout.surge }}
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "service.selector" (merge (dict "component" $process) $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.selector" (merge (dict "component" $process) $root) | nindent 8 }}
      annotations:
        checksum/config: {{ $root.Values.env | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $spec.grace | default 30 }}
      {{- include "service.pullSecrets" $root | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $process }}
          image: {{ include "service.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- with $spec.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
            - secretRef:
                name: {{ include "service.secretRef" $root }}
                optional: false
          {{- if $spec.port }}
          ports:
            - containerPort: {{ $spec.port }}
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep {{ $root.Values.drainSeconds }}"]
          {{- if and (eq $process "web") $root.Values.healthPath }}
          startupProbe:
            httpGet:
              path: {{ $root.Values.healthPath }}
              port: {{ $spec.port }}
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: {{ $root.Values.healthPath }}
              port: {{ $spec.port }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $root.Values.healthPath }}
              port: {{ $spec.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: {{ $spec.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ $spec.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- else }}
          {{- with $spec.liveness }}
          livenessProbe:
            exec:
              command:
                {{- toYaml . | nindent 16 }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with $spec.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $root.Values.storage.enabled }}
            - name: storage
              mountPath: {{ $root.Values.storage.mount }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $root.Values.storage.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ $name }}-storage
        {{- end }}
---
{{- end }}
{{- end }}
