bind 0.0.0.0
port 6379
protected-mode yes
dir /tmp
save ""
appendonly no
maxmemory ${REDIS_MAXMEMORY}
maxmemory-policy allkeys-lru
maxclients 10000
tcp-backlog 511
tcp-keepalive 300
timeout 0
databases 16
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
activedefrag yes
loglevel notice
always-show-logo no
