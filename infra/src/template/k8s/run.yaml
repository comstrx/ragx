apiVersion: batch/v1
kind: Job
metadata:
  name: ${APP_RUN_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/component: run
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: ${APP_RUN_TTL}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${SERVICE_NAME}
        app.kubernetes.io/component: run
    spec:
      restartPolicy: Never
      serviceAccountName: ${SERVICE_NAME}
      automountServiceAccountToken: false
      imagePullSecrets: ${APP_RUN_PULL_SECRETS}
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: run
          image: ${APP_RUN_IMAGE}
          command: ${APP_RUN_COMMAND}
          envFrom:
            - configMapRef:
                name: ${SERVICE_NAME}-config
            - secretRef:
                name: ${SERVICE_NAME}-owner-secrets
                optional: false
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: ${APP_RUN_CPU}, memory: ${APP_RUN_MEMORY} }
            limits: { memory: ${APP_RUN_MEMORY_LIMIT} }
          volumeMounts: ${APP_RUN_MOUNTS}
      volumes: ${APP_RUN_VOLUMES}
