project: default
infraRepo: ""
infraTag: ""
chartsPath: infra/src/template/helm
namespace: app
gatewayNamespace: gateway
syncRetries: 5
service: {}

domain: ""
hostnames: []
gatewayPanels: [api, super, admin]
sslEmail: ""
gatewayTls: true
gatewayDns01: false
edgeType: ""
edgeAnnotations: {}
envoyNamespace: envoy-gateway-system
certManagerNamespace: cert-manager
rateLimitPerMinute: 3000
edgeTrustedCidrs: []

envoyVersion: 1.8.3
certManagerVersion: v1.20.3
metricsServerVersion: 3.13.1
autoscalerVersion: 9.59.0
autoscalerImageTag: v1.36.1

metricsServerEnabled: true
autoscalerEnabled: true

clusterName: ""
region: ""
autoscalerRoleArn: ""

observability:
  enabled: true
  namespace: monitoring
  host: ""
  service: api
  gateway: gateway
  section: https
  retention: 7d
  metricsSize: 20Gi
  logs: true
  logsRelease: logs
  metricsRelease: metrics
  logsSize: 20Gi
  logsRetention: 168h
  cloud: false
  chatId: ""
  queueKeys: ""
  stackVersion: 88.2.0
  lokiVersion: 7.2.0
  alloyVersion: 1.11.1
  redisExporterVersion: 6.28.0
  postgresExporterVersion: 8.2.0
  cloudwatchExporterVersion: 0.28.1

platform:
  redis: true
  redisImage: redis:7-alpine
  redisSize: 5Gi
  redisCpu: 100m
  redisMemory: 256Mi
  redisMemoryLimit: 1Gi
  redisMaxmemory: 768mb
  priorityClass: platform-data
  postgresql: false
  pgImage: postgres:18
  pgSize: 20Gi
  pgCpu: 250m
  pgMemory: 512Mi
  pgMemoryLimit: 2Gi
  database: backend
  username: app
  storageClass: local-path
