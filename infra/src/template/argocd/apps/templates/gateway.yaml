apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ .Values.infraRepo }}
    targetRevision: {{ .Values.infraTag }}
    path: {{ .Values.chartsPath }}/gateway
    helm:
      valuesObject:
        domain: {{ .Values.domain }}
        hostnames: {{ .Values.hostnames | toJson }}
        sslEmail: {{ .Values.sslEmail }}
        tlsEnabled: {{ .Values.gatewayTls }}
        dns01: {{ .Values.gatewayDns01 }}
        edgeType: {{ .Values.edgeType | quote }}
        edgeAnnotations: {{ .Values.edgeAnnotations | toJson }}
        panels: {{ .Values.gatewayPanels | toJson }}
        routeNamespaces:
          - {{ .Values.namespace }}
          {{- if .Values.observability.enabled }}
          - {{ .Values.observability.namespace }}
          {{- end }}
        rateLimitPerMinute: {{ .Values.rateLimitPerMinute }}
        trustedCidrs: {{ .Values.edgeTrustedCidrs | toJson }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.gatewayNamespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
