apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ .Values.infraRepo }}
    targetRevision: {{ .Values.infraTag }}
    path: {{ .Values.chartsPath }}/service
    helm:
      valuesObject:
        {{- toYaml .Values.service | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: {{ .Values.syncRetries }}
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
