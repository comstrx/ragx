<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f6f7f8;font-family:Figtree,Arial,sans-serif;color:#17191c;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f8;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;padding:32px;">
                    <tr>
                        <td style="font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#0aa38a;">{{ app }}</td>
                    </tr>
                    <tr>
                        <td style="padding-top:16px;font-size:16px;line-height:1.6;">{% block body %}{% endblock %}</td>
                    </tr>
                    <tr>
                        <td style="padding-top:24px;font-size:12px;color:#656c75;">{% block footer %}Sent by {{ app }}.{% endblock %}</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
