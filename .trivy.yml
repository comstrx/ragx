debug: false
quiet: false
insecure: false
timeout: 10m0s

db:
  no-progress: true

pkg:
  include-dev-deps: true

image:
  image-config-scanners:
    - misconfig
    - secret

severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

vulnerability:
  ignore-status: []
  ignore-unfixed: true
  skip-vex-repo-update: false

  severity-source:
    - auto

scan:
  disable-telemetry: true
  skip-version-check: true
  show-suppressed: true

  detection-priority: comprehensive
  parallel: 10

  scanners:
    - vuln
    - secret
    - misconfig
    - license

  skip-dirs:
    - '**/.git'
    - '**/.claude'
    - '**/.codex'
    - '**/.agents'
    - '**/node_modules'
    - '**/vendor'
    - '**/.venv'
    - '**/target'
    - '**/dist'
    - '**/build'
    - '**/out'
    - '**/coverage'
    - '**/storage'
    - '**/generated'
    - '**/Pods'
    - '**/android'
    - '**/ios'
    - '**/.fleet'
    - '**/.zed'
    - '**/.vs'
    - '**/.vscode'
    - '**/.idea'
    - '**/.next'
    - '**/.nuxt'
    - '**/.expo'
    - '**/.turbo'
    - '**/.cache'
    - '**/.vite'
    - '**/.gradle'
    - '**/__pycache__'
    - '**/.pytest_cache'
    - '**/.mypy_cache'
    - '**/.ruff_cache'
    - '**/.hypothesis'
    - '**/.tox'
    - '**/.nox'
    - '**/.infra'
    - '**/.terraform'
    - '**/fuzz/corpus'
    - '**/fuzz/artifacts'

license:
  full: true

  ignored:
    - MIT
    - Apache-2.0
    - OFL-1.1
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - PSF-2.0
    - Python-2.0
