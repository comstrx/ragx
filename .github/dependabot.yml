version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'global(deps)'

  - package-ecosystem: uv
    directory: /engine/python
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'python(deps)'

  - package-ecosystem: bun
    directory: /engine/bun
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'bun(deps)'

  - package-ecosystem: uv
    directory: /product/api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'api(deps)'

  - package-ecosystem: docker
    directories: ['/product/infra/src/template/image']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'infra(deps)'

  - package-ecosystem: bun
    directory: /product/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'web(deps)'

  - package-ecosystem: bun
    directory: /product/mobile
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'mobile(deps)'
