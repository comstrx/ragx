version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'global(deps)'

  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'api(deps)'

  - package-ecosystem: docker
    directories: ['/infra/src/template/docker']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'infra(deps)'

  - package-ecosystem: helm
    directories: ['/infra/src/template/helm/*', '/infra/src/template/argocd/apps']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      helm:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'infra(deps)'

  - package-ecosystem: opentofu
    directories: ['/infra/src/template/tofu/aws/stacks/*', '/infra/src/template/tofu/aws/modules/*']
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      opentofu:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'infra(deps)'

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'web(deps)'
