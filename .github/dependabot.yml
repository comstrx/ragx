version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'global(deps)'

  - package-ecosystem: cargo
    directory: /api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'api(deps)'

  - package-ecosystem: cargo
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'infra(deps)'

  - package-ecosystem: bun
    directory: /panel
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
    labels: [deps]
    commit-message:
      prefix: 'panel(deps)'
