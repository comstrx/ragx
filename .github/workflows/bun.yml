name: Bun

on:
  push:
    branches: [main]
    paths:
      - 'engine/bun/**'
      - '.github/workflows/bun.yml'

  pull_request:
    paths:
      - 'engine/bun/**'
      - '.github/workflows/bun.yml'

  workflow_dispatch:

  workflow_call:

concurrency:
  group: ci-bun-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: engine/bun

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: engine/bun/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Audit
        run: bun audit
