name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      notes: ${{ steps.plan.outputs.notes }}
      prerelease: ${{ steps.plan.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::${TAG} is not a semver tag"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::${TAG} is not on main"; exit 1; }

          notes="$(awk -v tag="${TAG}" '$1 == "##" { if ( found ) exit; found = ( $2 == tag ); next } found' CHANGELOG.md)"
          [[ -n "${notes//[[:space:]]/}" ]] || { echo "::error::CHANGELOG.md has no section for ${TAG}"; exit 1; }

          delimiter="notes_$(openssl rand -hex 16)"
          { echo "notes<<${delimiter}"; printf '%s\n' "${notes}"; echo "${delimiter}"; } >> "${GITHUB_OUTPUT}"
          [[ "${TAG}" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  global:
    name: global
    needs: plan
    uses: $/.github/workflows/global.yml

  api:
    name: api
    needs: plan
    uses: $/.github/workflows/api.yml

  infra:
    name: infra
    needs: plan
    uses: $/.github/workflows/infra.yml

  web:
    name: web
    needs: plan
    uses: $/.github/workflows/web.yml

  publish:
    name: publish
    needs: [plan, global, api, infra, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # creates the release

    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.plan.outputs.notes }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "RagX ${TAG}" --notes-file -)
          [[ "${PRERELEASE}" == true ]] && flags+=(--prerelease)
          printf '%s\n' "${NOTES}" | gh release create "${TAG}" "${flags[@]}"
