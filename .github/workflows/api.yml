name: API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

  workflow_dispatch:

  workflow_call:

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: api

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6
        env:
          POSTGRES_USER: ragx
          POSTGRES_PASSWORD: ragx
          POSTGRES_DB: ragx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragx -d ragx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: ragx_test
      DB_USERNAME: ragx
      DB_PASSWORD: ragx
      DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1

      - name: Sync
        run: uv sync --locked --python 3.15

      - name: Lint
        run: uv run ruff check

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Boot
        run: uv run python -m bootstrap check
