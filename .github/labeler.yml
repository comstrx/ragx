python:
  - changed-files:
      - any-glob-to-any-file: ['engine/python/**']

bun:
  - changed-files:
      - any-glob-to-any-file: ['engine/bun/**']

api:
  - changed-files:
      - any-glob-to-any-file: ['product/api/**']

infra:
  - changed-files:
      - any-glob-to-any-file: ['product/infra/**']

web:
  - changed-files:
      - any-glob-to-any-file: ['product/web/**']

mobile:
  - changed-files:
      - any-glob-to-any-file: ['product/mobile/**']

global:
  - changed-files:
      - any-glob-to-any-file: ['*', '.*', '.github/**', 'skill/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**', '.github/dependabot.yml', '.zizmor.yml']

deps:
  - changed-files:
      - any-glob-to-any-file:
          - '**/pyproject.toml'
          - '**/uv.lock'
          - '**/package.json'
          - '**/bun.lock'
          - '**/Dockerfile*'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'LICENSE'

security:
  - changed-files:
      - any-glob-to-any-file:
          - 'SECURITY.md'
          - '.gitleaks.toml'
          - '.trivy.yml'
          - '.syft.yml'
          - '.zizmor.yml'
          - '**/.semgrep.yml'
